[tool.reff_linter]
target_file_lines = 200
warn_file_lines = 200
error_file_lines = 300
hard_file_lines = 500
max_function_lines = 60
max_complexity = 10
max_nesting = 3
max_parameters = 7
warn_todo_without_issue = true
check_cycles = true
check_wildcard_imports = true
strict_warnings = false

# Only application code is linted by default. Adjust include for each project.
include = [
  "src/**/*.py",
  "app/**/*.py",
  "backend/**/*.py",
  "services/**/*.py",
  "packages/**/*.py",
  "lib/**/*.py",
  "tests/**/*.py",
]

exclude = [
  ".git/**",
  ".venv/**",
  "venv/**",
  "node_modules/**",
  "__pycache__/**",
  "build/**",
  "dist/**",
  "generated/**",
  "migrations/**",
  "fixtures/**",
  "vendor/**",
  "legacy/**",
  ".backup*/**",
  ".claude/**",
  ".antigravity/**",
]

# Reviewed legacy baseline: paths are not scanned until explicitly migrated.
baseline_exclude = [
  "legacy/**",
  "examples/legacy/**",
  "vendor/**",
]

[[exception]]
pattern = "**/generated/**"
reason = "Generated source; do not edit manually"
expires = "2099-12-31"

[[exception]]
pattern = "**/migrations/**"
reason = "Migration history is append-only"
expires = "2099-12-31"
