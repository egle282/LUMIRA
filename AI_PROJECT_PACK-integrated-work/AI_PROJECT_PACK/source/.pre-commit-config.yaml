# Portable security and quality hooks. Keep revisions pinned and update deliberately.
minimum_pre_commit_version: '3.7.0'
fail_fast: false
default_stages: [pre-commit, pre-push]
exclude: '(^|/)(.git|node_modules|.venv|venv|dist|build|coverage|.backup_before_unification_)(/|$)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.172.0
    hooks:
      - id: semgrep
        args: [--config, p/security-audit, --error, --skip-unknown-extensions]
        files: '\.(py|js|jsx|ts|tsx|go|java|rb|php|c|cpp|rs)$'
