name: LUMIRA CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Tests & Compile Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lumira
          POSTGRES_PASSWORD: lumira_password
          POSTGRES_DB: lumira_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio anyio httpx greenlet

      - name: Python Compile Check
        run: |
          python -m compileall backend/

      - name: Configure PostgreSQL Test Role Privileges
        run: |
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text

          async def configure():
              engine = create_async_engine('postgresql+asyncpg://lumira:lumira_password@127.0.0.1:5433/lumira_db')
              async with engine.begin() as conn:
                  await conn.execute(text('''
                      DO \$\$
                      BEGIN
                          IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'lumira' AND (rolsuper = true OR rolbypassrls = true)) THEN
                              ALTER ROLE lumira NOSUPERUSER CREATEROLE NOBYPASSRLS;
                          END IF;
                      END
                      \$\$;
                  '''))
              await engine.dispose()

          asyncio.run(configure())
          "

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://lumira:lumira_password@127.0.0.1:5433/lumira_db
          JWT_SECRET: lumira_test_secret_32_characters_long_min!
          PYTHONPATH: .
        run: |
          pytest backend/tests/ tests/

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  compose-clean-install:
    name: Docker Compose Clean Install Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create temporary environment
        run: |
          cat > .env <<EOF
          ENVIRONMENT=development
          DB_USER=lumira_admin
          DB_PASSWORD=$(openssl rand -hex 24)
          DB_NAME=lumira_db
          APP_DB_USER=lumira_app
          APP_DB_PASSWORD=$(openssl rand -hex 24)
          ADMIN_DB_USER=lumira_admin_role
          ADMIN_DB_PASSWORD=$(openssl rand -hex 24)
          REDIS_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET=$(openssl rand -hex 32)
          ADMIN_EMAIL=
          ADMIN_PASSWORD=
          TELEGRAM_BOT_TOKEN=
          LLM_API_KEY=
          OPENROUTER_API_KEY=
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start core services
        run: docker compose up --build -d db redis backend frontend

      - name: Wait for database and initialize schema
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U lumira_admin -d lumira_db; then
              break
            fi
            sleep 2
          done
          docker compose exec -T db pg_isready -U lumira_admin -d lumira_db
          docker compose exec -T backend python backend/scripts/init_tables.py

      - name: Verify API and frontend respond
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/api/health
          curl --fail --silent http://127.0.0.1:5173/ | grep -qi '<html'

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and remove containers
        if: always()
        run: docker compose down -v
