services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-lumira_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: lumira_prod
      APP_DB_USER: ${APP_DB_USER:-lumira_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      ADMIN_DB_USER: ${ADMIN_DB_USER:-lumira_admin_role}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    networks:
      - lumira_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lumira_admin} -d lumira_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redisdata:/data
    networks:
      - lumira_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  init-db:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    command: ["python", "-m", "backend.scripts.init_tables"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-lumira_admin}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db/lumira_prod
      - APP_DB_USER=${APP_DB_USER:-lumira_app}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ADMIN_DB_USER=${ADMIN_DB_USER:-lumira_admin_role}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lumira_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${APP_DB_USER:-lumira_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db/lumira_prod
      - ADMIN_DATABASE_URL=postgresql+asyncpg://${ADMIN_DB_USER:-lumira_admin_role}:${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD in .env}@db/lumira_prod
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LLM_API_KEY=${LLM_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO}
      - STRIPE_PRICE_PREMIUM=${STRIPE_PRICE_PREMIUM}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - lumira_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile.bot
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${APP_DB_USER:-lumira_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db/lumira_prod
      - ADMIN_DATABASE_URL=postgresql+asyncpg://${ADMIN_DB_USER:-lumira_admin_role}:${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD in .env}@db/lumira_prod
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LLM_API_KEY=${LLM_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - lumira_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lumira_net

volumes:
  pgdata:
  redisdata:

networks:
  lumira_net:
    driver: bridge
